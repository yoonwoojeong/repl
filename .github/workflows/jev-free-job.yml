name: jev_demo free job (no API key)

# Runs jev_demo/scripts/free_job.sh when a push to the PR branch changes it. Used for work that
# needs network this repo's cloud sessions do not have (Zenodo, the Mathlib build cache) and
# costs no API money: the job never receives ANTHROPIC_API_KEY. Outputs under
# jev_demo/results_free/ (and jev_demo/data/standard/) are committed back to the branch.
on:
  push:
    branches: ["claude/**"]
    paths: ["jev_demo/scripts/free_job.sh"]

permissions:
  contents: write

jobs:
  free:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: run the job
      run: bash jev_demo/scripts/free_job.sh
    - name: commit outputs to the branch
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
        for d in jev_demo/results_free jev_demo/data/standard; do
          if [ -e "$d" ]; then git add -f "$d"; fi
        done
        if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
        git commit -m "jev_demo: free job outputs (run ${GITHUB_RUN_ID})"
        git pull --rebase origin "${GITHUB_REF_NAME}"
        git push origin "HEAD:${GITHUB_REF_NAME}"
