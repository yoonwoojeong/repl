name: jev_demo phase 2 (live, spends money)

# Runs the paid phase-2 experiment with the `ANTHROPIC_API_KEY` repository secret
# (Settings -> Secrets and variables -> Actions). Never runs on push: start it by adding the
# `run-phase2-live` label to a pull request (runs on the PR's head branch), or from the Actions tab
# once this file is on the default branch. Results are committed back to the branch it ran on.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      max_usd:
        description: "hard spend cap for run-phase2 (USD)"
        default: "20"

permissions:
  contents: write

concurrency:
  group: jev-phase2-live
  cancel-in-progress: false

jobs:
  phase2:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-phase2-live'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAX_USD: ${{ github.event.inputs.max_usd || '20' }}
      BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
    - name: Check the API key secret is set
      run: |
        if [ -z "$ANTHROPIC_API_KEY" ]; then
          echo "::error::Repository secret ANTHROPIC_API_KEY is not set (Settings -> Secrets and variables -> Actions)."
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      with:
        ref: ${{ env.BRANCH }}

    - name: install elan
      run: |
        set -o pipefail
        curl -sSfL https://github.com/leanprover/elan/releases/download/v3.0.0/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
        ./elan-init -y --default-toolchain none
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: build
      run: lake build

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: install jev_demo and run the offline tests
      run: |
        pip install -e 'jev_demo[dev]'
        python -m pytest jev_demo -q

    - name: collect Claude labels on the train theorems
      env:
        ANTHROPIC_RUN_LIVE: "1"
      run: |
        set -o pipefail
        mkdir -p jev_demo/results_phase2
        python -m jev_demo collect 2>&1 | tee jev_demo/results_phase2/collect.log

    - name: run phase 2 on the test theorems
      env:
        ANTHROPIC_RUN_LIVE: "1"
      run: |
        set -o pipefail
        python -m jev_demo run-phase2 --out jev_demo/results_phase2 --max-usd "$MAX_USD" 2>&1 \
          | tee jev_demo/results_phase2/run-phase2.log

    - name: upload results and logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jev-phase2-results
        path: |
          jev_demo/data/claude_labels.json
          jev_demo/results_phase2/
        if-no-files-found: warn

    - name: commit results to the branch
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
        git add -f jev_demo/data/claude_labels.json jev_demo/results_phase2 2>/dev/null || true
        if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
        git commit -m "jev_demo: phase 2 live results (run ${{ github.run_id }})"
        git push origin "HEAD:$BRANCH"
